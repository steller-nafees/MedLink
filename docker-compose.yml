services:
  postgres:
    image : postgres:17

    container_name: medlink-postgres
    restart : unless-stopped

    environment:
      - POSTGRES_USER=medlink
      - POSTGRES_PASSWORD=MedLink@2026
      - POSTGRES_DB=medlink
    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
